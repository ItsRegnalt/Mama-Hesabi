<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pati Gram">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png?v=4" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4" sizes="180x180">
  <meta property="og:title" content="Pati Gram">
  <meta property="og:description" content="Kediniz için günlük mama miktarı ve RER hesaplama.">
  <meta property="og:image" content="https://itsregnalt.github.io/Pati_Gram/icon-512.png?v=4">
  <meta property="og:url" content="https://itsregnalt.github.io/Pati_Gram/">
  <meta property="og:type" content="website">
  <title>Pati Gram · Kedi Mama Hesabı</title>
  <link rel="stylesheet" href="style.css?v=cats-6">
  <script defer src="calculator.js?v=aaha-1"></script>
  <script defer src="locales.js?v=5"></script>
  <script defer src="app.js?v=cats-6"></script>
</head>
<body>
  <main>
    <div class="toolbar">
      <details class="language-control" id="language"><summary aria-label="Dil / Language" title="Dil / Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18Z"/></svg>
        </summary><div class="language-menu" role="group" aria-label="Dil / Language"><button type="button" data-language="tr" aria-pressed="true" lang="tr">Türkçe</button><button type="button" data-language="en" aria-pressed="false" lang="en">English</button><button type="button" data-language="de" aria-pressed="false" lang="de">Deutsch</button><button type="button" data-language="es" aria-pressed="false" lang="es">Español</button></div>
      </details>
      <div class="theme-controls">
        <button type="button" id="theme-toggle" role="switch" aria-checked="false" aria-label="Koyu moda geç" title="Koyu moda geç">
          <span class="theme-thumb" aria-hidden="true"></span>
          <svg data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A9 9 0 0 1 10.8 3.5a9 9 0 1 0 9.7 9.7Z"/></svg>
        </button>
      </div>
    </div>
      <div class="cat-navigation"><div id="cat-tabs" role="tablist" aria-label="Kediler"></div><button type="button" id="add-cat" aria-label="Kedi ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <p id="cat-actions-hint" class="sr-only"></p>
    <section class="cats" id="cats" aria-label="Kedilerin beslenme ayarları"></section>
    <footer>
      <div class="footer-actions">
        <details id="install-help"><summary id="install-title">Ana ekrana ekle</summary><div id="install-instructions"></div></details>
        <button type="button" class="delete-cat" id="remove-cat" hidden>Kedi profilini kaldır</button>
      </div>
      <div class="footer-meta"><p id="save-status" class="hint save-status" role="status"></p><p id="copyright"></p></div>
    </footer>
    <dialog id="appearance-dialog" aria-labelledby="appearance-title">
      <h2 id="appearance-title">Kedi görünümü</h2>
      <div id="appearance-options"></div>
      <form method="dialog" class="dialog-actions"><button id="appearance-close">Kapat</button></form>
    </dialog>
    <dialog id="delete-dialog" aria-labelledby="delete-question">
      <form method="dialog">
        <div id="delete-confirm">
        <p id="delete-question">Bu kedi profilini kaldırmak ister misin?</p>
        <div class="dialog-actions"><button id="delete-no" value="cancel" autofocus>Hayır</button><button id="delete-yes" value="delete">Evet</button></div>
        </div>
        <div id="delete-success" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
          <p id="delete-success-message" role="status"></p>
          <div class="dialog-actions"><button id="delete-done" value="cancel">Tamam</button></div>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
